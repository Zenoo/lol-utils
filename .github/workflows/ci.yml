name: Quality and Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run smoke
      - run: npm run pack
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-evidence
          path: |
            artifacts/*.json
            artifacts/*.png
            artifacts/*.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: dist/win-unpacked/
